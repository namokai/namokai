<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5757"/>
      <stop offset="0.5" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#6ea8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#ff5c8a" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#6ea8ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c8ff00" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="180" rx="14" fill="#0b1026"/>

  <!-- border gradient statis tipis + cahaya berjalan mengelilingi kartu -->
  <rect x="1" y="1" width="598" height="178" rx="14" fill="none" stroke="url(#horizon)" stroke-width="1.5" opacity="0.35"/>
  <rect x="1" y="1" width="598" height="178" rx="14" fill="none" stroke="url(#horizon)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="12 88">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="6s" repeatCount="indefinite"/>
  </rect>

  <ellipse cx="300" cy="185" rx="330" ry="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- stars -->
  <g fill="#8b93a7">
    <circle cx="60" cy="30" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="55" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="35" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="70" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="25" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="90" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.5;.53;.66;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="640,10;640,10;100,45;100,45" keyTimes="0;.5;.66;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="30" y2="-5" stroke="url(#comet)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- name -->
  <text x="300" y="66" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="3" fill="#c8ff00">ALIFIAN AURELYO RADITYA</text>
  <text x="306" y="66" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="3" fill="#c8ff00" opacity="0">A
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.02;.04;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- gradient underline draws in -->
  <rect x="300" y="78" width="0" height="3" rx="1.5" fill="url(#horizon)">
    <animate attributeName="width" values="0;240" dur="1.2s" fill="freeze"/>
    <animate attributeName="x" values="300;180" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- rotating roles -->
  <g font-size="15" font-weight="500" fill="#8b93a7" text-anchor="middle">
    <text x="300" y="112" opacity="0">IT Support &amp; Community Operations
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.34;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="112" opacity="0">UI/UX Design — Niagahoster × Rakamin
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="112" opacity="0">Business Data Analytics — in progress
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- tagline -->
  <text x="300" y="148" text-anchor="middle" font-size="12" fill="#55607a">IT Graduate · problem solver · fast learner · detail oriented</text>
</svg>
